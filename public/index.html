<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미션 2 | 청구서·영수증 검증</title>
  <link rel="stylesheet" href="/styles.css?v=7">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><g transform="rotate(-45 12 12)"><rect x="3" y="8" width="18" height="8" rx="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 8h5a4 4 0 0 1 0 8h-5z" fill="currentColor"/></g></svg></span><span>문서 정합성 검증</span></div>
    <span class="project-badge">UPSTAGE AGENT</span>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <h1>청구서와 영수증,<br><strong>한 번에 검증하세요.</strong></h1>
        <p class="hero-copy">두 문서를 올리면 금액·기간·환자명·수납액을 비교하고<br>누락 문서와 예외 사항까지 자동으로 정리합니다.</p>
      </div>
      <div class="hero-note"><span>01</span><p>파일 업로드<br><b>PDF · 이미지 · 문서</b></p></div>
      <div class="hero-note"><span>02</span><p>AI 정합성 검증<br><b>Upstage Agent</b></p></div>
    </section>

    <section class="workspace">
      <div class="section-heading">
        <div><span class="step">STEP 01</span><h2>검증할 문서를 올려주세요</h2></div>
        <p id="upload-hint">청구서와 영수증 PDF를 각각 올려주세요.</p>
      </div>
      <div class="upload-toolbar">
        <div class="mode-toggle" role="tablist" aria-label="업로드 방식">
          <button type="button" class="mode-option active" data-mode="separate" role="tab" aria-selected="true">따로 올리기</button>
          <button type="button" class="mode-option" data-mode="combined" role="tab" aria-selected="false">한 파일로 올리기</button>
        </div>
        <button type="button" class="sample-button" id="sample-button">예시 문서로 체험하기</button>
      </div>
      <div class="upload-grid">
        <label class="upload-card combined" data-type="combined" hidden>
          <input type="file" class="file-input" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png">
          <span class="file-icon">IN+RE</span><span class="upload-label">청구서 + 영수증</span>
          <strong>두 문서가 함께 담긴 PDF나 사진을 끌어다 놓거나<br><u>클릭해서 선택</u></strong><small>PDF · 사진(JPG, PNG) · 최대 500MB</small>
          <button type="button" class="camera-button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>카메라로 촬영</button>
          <input type="file" class="camera-input" accept="image/*" capture="environment" hidden>
          <span class="selected-file"></span>
          <button type="button" class="remove-file" aria-label="파일 취소" hidden>×</button>
        </label>
        <label class="upload-card" data-type="invoice">
          <input type="file" class="file-input" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png">
          <span class="file-icon">IN</span><span class="upload-label">청구서</span>
          <strong>파일을 끌어다 놓거나<br><u>클릭해서 선택</u></strong><small>PDF · 사진(JPG, PNG) · 최대 500MB</small>
          <button type="button" class="camera-button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>카메라로 촬영</button>
          <input type="file" class="camera-input" accept="image/*" capture="environment" hidden>
          <span class="selected-file"></span>
          <button type="button" class="remove-file" aria-label="파일 취소" hidden>×</button>
        </label>
        <label class="upload-card" data-type="receipt">
          <input type="file" class="file-input" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png">
          <span class="file-icon receipt">RE</span><span class="upload-label">영수증</span>
          <strong>파일을 끌어다 놓거나<br><u>클릭해서 선택</u></strong><small>PDF · 사진(JPG, PNG) · 최대 500MB</small>
          <button type="button" class="camera-button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>카메라로 촬영</button>
          <input type="file" class="camera-input" accept="image/*" capture="environment" hidden>
          <span class="selected-file"></span>
          <button type="button" class="remove-file" aria-label="파일 취소" hidden>×</button>
        </label>
      </div>
      <button class="primary-button" id="analyze-button" disabled>두 문서 검증하기 <span>→</span></button>
      <p class="status-message" id="status-message" role="status"></p>
    </section>

    <section class="results" id="results" hidden>
      <div class="section-heading">
        <div><span class="step">STEP 02</span><h2>검증 결과</h2></div>
        <span class="result-status" id="result-status">분석 완료</span>
      </div>
      <div class="summary-grid" id="summary-grid"></div>
      <div class="detail-layout">
        <div class="data-card">
          <div class="card-title"><h3>추출된 정보</h3><span>EXTRACTED DATA</span></div>
          <div class="data-table" id="data-table"></div>
        </div>
        <div class="data-card exceptions">
          <div class="card-title"><h3>예외 케이스</h3><span>EXCEPTION HANDLING</span></div>
          <ul id="exception-list"></ul>
        </div>
      </div>
      <button class="secondary-button" id="reset-button">새 문서 검증하기</button>
    </section>
  </main>
  <script src="/app.js?v=17"></script>
</body>
</html>
